server {
    listen 80;
    listen [::]:80;
    server_name wshub-user.dv;
    index index.php;
    root /var/www/html/wshub_user/public;

    client_max_body_size 48m;
    fastcgi_read_timeout 90s;

    
    location /assets/ {
        alias /var/www/html/wshub_user/assets/;
        access_log off;
        add_header Cache-Control "no-cache";
    }


    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
#         fastcgi_index index.php;
        fastcgi_pass php_fpm:9000;
    }

    # WS proxying configuration
     location = /ws {
              proxy_pass http://wshub:8585/ws;

              add_header Cache-Control "no-cache" always;

              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              # nginx closes idle proxied connections after 60s by default; keep sockets open longer
              proxy_read_timeout 3600s;

              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

     location = /ws-old {
              proxy_pass http://wshub:8585/ws-old;

              add_header Cache-Control "no-cache" always;

              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              # nginx closes idle proxied connections after 60s by default; keep sockets open longer
              proxy_read_timeout 3600s;

              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }


    # QGIS Server proxying: same origin as the page, so no CORS for GetMap
;     location /qgis/ {
;         proxy_pass http://qgis_server:80/ows/;
;
;         proxy_set_header Host $http_host;
;         proxy_set_header X-Real-IP $remote_addr;
;         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
;         proxy_set_header X-Forwarded-Proto $scheme;
;     }

    # ---



     access_log /var/www/html/logs/wshub-user-access.log;
     error_log  /var/www/html/logs/wshub-user-error.log notice;
}