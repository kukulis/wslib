networks:
    wslib-network:
        name: wslib-network
        external: true

services:
    wshub:
        image: darbelis/wshub:latest
        container_name: wshub
        build:
            context: ./hub
            dockerfile: ../.docker/wshub/Dockerfile
        volumes:
            - ./hub:/app
            - wshub_go_mod_cache:/go/pkg/mod
            - wshub_go_build_cache:/go-cache
#        ports:
#            - "8585:8585"
        networks:
            - wslib-network
    wshub_user:
        image: darbelis/wshub_user:latest
        container_name: wshub_user
        build:
            context: ./
            dockerfile: .docker/wshub_user/Dockerfile
        volumes:
            - ./:/var/www/html
            - ./shared:/var/shared
#            - ./.docker/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
        environment:
            BASEDIR: /var/www/html/wshub_user
#            COMPOSER_AUTH: '${COMPOSER_AUTH}'
#            HOME: /var/www/html
            PHP_IDE_CONFIG: 'serverName=wshub-user.dv'
        networks:
            - wslib-network

    wshub_user_web:
        image: darbelis/wshub_user_web:latest
        container_name: wshub_user_web
        build:
            context: ./
            dockerfile: .docker/web/Dockerfile
        links:
            - wshub_user:php_fpm
        ports:
            - "8787:80"
        environment:
            - BASEDIR=/var/www/html

        volumes:
            - ./.docker/web/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
            - ./shared:/var/shared

        networks:
            - wslib-network

        depends_on:
            - wshub_user
            - qgis_server

    wshub_user_db:
        image: mariadb:11.5
        container_name: wshub_user_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: wshub_user_db
            MYSQL_USER: wshub_user_user
            MYSQL_PASSWORD: wshub_user_pass
        ports:
            - "11306:3306"
        volumes:
            - wshub_user_db_data:/var/lib/mysql
            - ./.docker/db/conf.d:/etc/mysql/conf.d
        networks:
            - wslib-network
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 30s

    wshub_user_test_db:
        image: mariadb:11.5
        container_name: wshub_user_test_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: wshub_test
            MYSQL_USER: wshub_test
            MYSQL_PASSWORD: wshub_test
        ports:
            - "12306:3306"
        volumes:
            - wshub_user_test_db_data:/var/lib/mysql
            - ./.docker/test_db/conf.d:/etc/mysql/conf.d
        networks:
            - wslib-network
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 30s

    qgis_server:
        image: camptocamp/qgis-server:3.44
        container_name: qgis_server
        restart: unless-stopped
        environment:
            # project served when requests carry no MAP parameter
            QGIS_PROJECT_FILE: /etc/qgisserver/project.qgz
        volumes:
            - ./qgis_projects:/etc/qgisserver:ro
        ports:
            - "8686:80"
        networks:
            - wslib-network

volumes:
    wshub_user_db_data:
    wshub_user_test_db_data:
    wshub_go_mod_cache:
    wshub_go_build_cache:
